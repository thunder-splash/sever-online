<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Поиск туров · Andromeda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="bar">
    <a class="mark" href="./">Север<span>.</span></a>
    <span class="bar-note">онлайн-поиск · Andromeda</span>
  </header>

  <main>
    <section class="stage">
      <div class="stage-bg" aria-hidden="true"></div>
      <div class="stage-inner">
        <h1>Север.</h1>
        <p class="sub">Пакетные туры с живыми ценами из баз туроператоров.</p>

        <form class="finder" id="searchForm">
          <label class="field">
            <span>Откуда</span>
            <select name="from" required>
              <option value="1">Москва</option>
              <option value="5">Санкт-Петербург</option>
              <option value="9">Казань</option>
              <option value="12">Екатеринбург</option>
            </select>
          </label>
          <label class="field">
            <span>Куда</span>
            <select name="to" required>
              <option value="15">Турция</option>
              <option value="23">Египет</option>
              <option value="41">ОАЭ</option>
              <option value="58">Таиланд</option>
            </select>
          </label>
          <label class="field">
            <span>Вылет</span>
            <input type="date" name="dateFrom" required />
          </label>
          <label class="field narrow">
            <span>Ночей</span>
            <select name="nights">
              <option>7</option>
              <option selected>10</option>
              <option>14</option>
            </select>
          </label>
          <label class="field narrow">
            <span>Туристы</span>
            <select name="adults">
              <option value="2" selected>2</option>
              <option value="1">1</option>
              <option value="3">3</option>
            </select>
          </label>
          <button type="submit" class="go">Найти</button>
        </form>
      </div>
    </section>

    <section class="board" id="board" hidden>
      <div class="board-top">
        <h2 id="boardTitle">Предложения</h2>
        <button type="button" class="raw-toggle" id="rawToggle" hidden>запрос API</button>
      </div>

      <div class="raw" id="apiTrace" hidden>
        <pre id="traceBody"></pre>
      </div>

      <div class="list" id="results" aria-live="polite"></div>
    </section>
  </main>

  <footer class="foot">
    <span>Демо-витрина</span>
    <span>mock · без боевых ключей</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
